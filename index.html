<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f26f61">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Naxosv2">
  <title>Naxosv2</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Back" hidden>‹</button>
      <div class="top-title">
        <span class="eyebrow">Course source</span>
        <strong id="pageTitle">Naxosv2</strong>
      </div>
      <button id="installBtn" class="install-btn" type="button" hidden>Install</button>
    </header>

    <section id="homeView" class="view">
      <div class="hero">
        <div class="naxos-logo" aria-hidden="true">Naxos</div>
        <h1>Learner evidence packs</h1>
        <p>Learners see clear packs. The full official standard or qualification mapping stays behind them for Evia.</p>
      </div>
      <div id="courseCards" class="course-list"></div>
    </section>

    <section id="courseView" class="view" hidden>
      <div id="courseHeader" class="course-header"></div>
      <div class="tabs">
        <button class="tab active" data-tab="packs">Packs</button>
        <button class="tab" data-tab="standard">Standard</button>
        <button class="tab" data-tab="data">Data</button>
      </div>
      <div id="courseContent"></div>
    </section>

    <footer class="footer">Naxosv2 · source-of-truth for Evia</footer>
  </main>

  <script src="./data/6570-05/source/course-core.js"></script>
  <script src="./data/6570-05/source/unit-102.js"></script>
  <script src="./data/6570-05/source/units-234-235.js"></script>
  <script src="./data/6570-05/source/unit-238.js"></script>
  <script src="./data/6570-05/source/units-303-300-502.js"></script>
  <script src="./data/6570-05/source/unit-313.js"></script>
  <script src="./data/6570-05/source/unit-690.js"></script>
  <script src="./data/6570-05/source/unit-701.js"></script>
  <script src="./data/6570-05/source/unit-828.js"></script>
  <script src="./data/6570-05/source/unit-837.js"></script>
  <script src="./data/6570-05/normalise.js"></script>
  <script src="./app.js"></script>
  <script src="./app-6570-selection.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="./course-qr.js"></script>
</body>
</html>
