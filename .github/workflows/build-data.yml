name: Build Naxosv2 course source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build.py'
      - 'source/official-metadata.json'
      - 'naxosv2-main-task-structure.json'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate course data
        run: python scripts/build.py
      - name: Commit generated Naxosv2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build learner-facing Naxosv2 course source"
            git push
          fi
